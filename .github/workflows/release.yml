name: Build arm64 Dropbear (Android)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: build aarch64-linux-musl
    runs-on: ubuntu-24.04-arm
    env:
      TARGET: aarch64-linux-musl
      DROPBEAR_VERSION: 2025.88
      ZIG_VERSION: 0.15.1
      JOBS: 8

    steps:
      - uses: actions/checkout@v4

      - name: Smoke arch
        run: uname -m

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates tar bzip2 xz-utils patch \
            autoconf automake make gcc g++ cmake ninja-build

      - name: Make build scripts executable
        run: |
          git update-index --chmod=+x build.sh || true
          git update-index --chmod=+x build-sftp-server.sh || true

      # dropbear is the part that matters; it must succeed.
      - name: Build static dropbear (musl + android passwd patch)
        run: ./build.sh

      - name: Show dropbear outputs
        run: ls -l out/

      # sftp-server is optional (only needed for `sftp`). Don't fail the run.
      - name: Build static sftp-server (OpenSSH, optional)
        continue-on-error: true
        env:
          OPENSSH_VERSION: 9.8p1
        run: ./build-sftp-server.sh

      - name: Show sftp outputs
        run: ls -l out/ sftp-server-*.tar.xz* 2>/dev/null || true

      - name: Smoke test in Alpine (arm64)
        run: |
          mkdir -p testdir
          tar -xJf "out/dropbear-${TARGET}.tar.xz" -C testdir
          docker run --rm --platform linux/arm64 \
            -v "$PWD/testdir/dropbear-${TARGET}:/out:ro" alpine:3 sh -lc '
            apk add --no-cache file >/dev/null 2>&1 || true
            file /out/dropbear || true
            /out/dropbear -h 2>&1 | grep -E "^-y |^-Y " || (echo "MISSING -y/-Y"; exit 1)
            echo "SMOKE OK"
          '

      - name: Upload dropbear artifact
        uses: actions/upload-artifact@v4
        with:
          name: dropbear-${{ env.TARGET }}-${{ github.run_id }}
          overwrite: true
          path: |
            out/dropbear-${{ env.TARGET }}.tar.xz
            out/dropbear-${{ env.TARGET }}.tar.xz.SHA256

      - name: Upload sftp-server artifact (optional)
        if: hashFiles('out/sftp-server-*.tar.xz') != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: sftp-server-${{ env.TARGET }}-${{ github.run_id }}
          overwrite: true
          path: |
            out/sftp-server-${{ env.TARGET }}.tar.xz
            out/sftp-server-${{ env.TARGET }}.tar.xz.SHA256

  release:
    name: create github release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - run: ls -lR dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            dist/**/dropbear-*.tar.xz
            dist/**/dropbear-*.tar.xz.SHA256
            dist/**/sftp-server-*.tar.xz
            dist/**/sftp-server-*.tar.xz.SHA256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
